spring.application.name=TallerAutomotriz

# Servidor
server.port=8080

# Base de datos PostgreSQL (pgAdmin 4)
# Ajusta DB_USER y DB_PASSWORD en IntelliJ o en un archivo application-dev.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taller_automotriz}
spring.datasource.username=${DB_USER:user_java}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Codificacion
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
