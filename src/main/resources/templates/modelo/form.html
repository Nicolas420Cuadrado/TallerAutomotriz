<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Modelo')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout/base :: sidebar}"></aside>
    <div class="main">
        <header th:replace="~{layout/base :: header}"></header>
        <main class="content">
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="encabezado">
                <div>
                    <h1 th:text="${editando} ? 'Editar modelo' : 'Nuevo modelo'">Nuevo modelo</h1>
                    <p>La combinacion de marca y modelo debe ser unica.</p>
                </div>
            </div>

            <div class="tarjeta">
                <form class="formulario" th:action="${editando} ? @{/modelos/{id}(id=${modelo.idModelo})} : @{/modelos}"
                      th:object="${modelo}" method="post">
                    <input type="hidden" th:field="*{idModelo}">

                    <div class="campo" th:classappend="${#fields.hasErrors('marca')} ? 'campo-con-error'">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" th:field="*{marca}" maxlength="100" placeholder="Ej: Toyota">
                        <span class="field-error" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                    </div>

                    <div class="campo" th:classappend="${#fields.hasErrors('nombreModelo')} ? 'campo-con-error'">
                        <label for="nombreModelo">Modelo</label>
                        <input type="text" id="nombreModelo" th:field="*{nombreModelo}" maxlength="100" placeholder="Ej: Corolla">
                        <span class="field-error" th:if="${#fields.hasErrors('nombreModelo')}" th:errors="*{nombreModelo}"></span>
                    </div>

                    <div class="form-acciones">
                        <button type="submit" class="btn" th:text="${editando} ? 'Guardar cambios' : 'Registrar modelo'"></button>
                        <a class="btn btn-secundario" th:href="@{/modelos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
        <footer th:replace="~{layout/base :: pie}"></footer>
    </div>
</div>
</body>
</html>
